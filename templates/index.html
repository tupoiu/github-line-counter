<div class="wrapper">
    <h1>How many lines in this Github repo?</h1>
    <p>Paste the link <b>ending with .git</b> in the searchbox and see how many lines are in the repo.
    <br>This'll break for large repos (100s of MB) because the server I'm hosting on is tiny!</p>
    <input id="linkbox" placeholder="Git link e.g. https://github.com/tupoiu/blah.git"></input>
    <button id="submit">Count!</button>
    <span id="outbox"></span>
</div>
<script>
    var input = document.getElementById('linkbox')
    var button = document.getElementById('submit')

    button.onclick = function() {
        var link = input.value
        var span = document.getElementById('outbox')
        span.textContent = 'Loading...'
        fetch('/loc?git_link=' + link)
            .then(response => response.json())
            .then(data => {
                if (!data.lines) {
                    throw new Error('Failed to download git repo')
                } else {
                    let table = document.createElement('table')
                    // Sort lines by number of lines descending
                    let sortedLines = Object.fromEntries(
                        Object.entries(data.lines).sort(([,a],[,b]) => b-a)
                    )
                    Object.entries(sortedLines).forEach(([extension, num_lines]) => {
                        // Add a new table row for each extension
                        var row = document.createElement('tr')
                        var extCell = document.createElement('td')
                        extCell.textContent = extension
                        var linesCell = document.createElement('td')
                        linesCell.textContent = num_lines
                        row.appendChild(extCell)
                        row.appendChild(linesCell)
                        table.appendChild(row)
                    });
                    span.innerHTML = table.outerHTML
                }
            }).catch(err => {
                span.textContent = 'Error: ' + err
            })
    }
</script>
<style>
    .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: auto;
    }
    #linkbox {
        width: 50%;
        font-size: 16px;
        margin: 5%;
    }
    #submit {
        font-size: 20px;
    }
</style>
